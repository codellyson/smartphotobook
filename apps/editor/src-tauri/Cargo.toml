[package]
name = "smartphotobook"
version = "0.1.0"
description = "SmartPhotobook — desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
printpdf = { version = "0.7", features = ["embedded_images"] }
base64 = "0.22"
